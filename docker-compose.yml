# Sign a profile in once, then run against it:
#
#   docker compose run --rm --service-ports signin
#   docker compose run --rm rewards-farmer
#
# See the Docker section of the README.

services:
  rewards-farmer:
    build: .
    image: rewards-farmer
    platform: linux/amd64
    # Chromium wants more than the default 64MB of shared memory and crashes
    # partway through a page without it.
    shm_size: 1gb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The container decides these itself. REWARDS_ACCOUNTS and the log level
    # are substituted from the host's .env, where a host run already keeps
    # them, so there is one place to edit.
    environment:
      REWARDS_HEADLESS: "1"
      REWARDS_ACCOUNTS: ${REWARDS_ACCOUNTS:-}
      REWARDS_FARMER_LOG_LEVEL: ${REWARDS_FARMER_LOG_LEVEL:-INFO}
    env_file:
      # Optional container-specific settings: QUERY_SOURCE=llm plus the
      # provider, endpoint and key it needs. Copy .env.docker.example to
      # .env.docker and edit it.
      #
      # The host's .env is deliberately not loaded here. It carries host paths
      # (EDGE_BINARY, USER_DATA_DIR) that mean something else or nothing in the
      # container, and an Ollama address of localhost, which inside the
      # container is the container itself rather than the machine running it.
      - path: .env.docker
        required: false
    volumes:
      # Keeps the sign-in across container rebuilds.
      - ./data-dir:/app/data-dir
      # visual_search.jpg is not in the repository. A run generates it inside
      # the container when it is missing, so nothing has to be mounted here. To
      # supply your own image instead, bind mount it over the generated one:
      #   - ./my-visual-search.jpg:/app/visual_search.jpg:ro

  # One off, before the first run. Opens the Rewards sign-in in a browser
  # inside the container and puts that browser on your screen as a web page,
  # so the profile is written by the same Edge that will later read it.
  #
  #   docker compose run --rm --service-ports signin
  #   REWARDS_ACCOUNTS=personal docker compose run --rm --service-ports signin
  #
  # --service-ports is not optional: `run` publishes nothing without it, and
  # the page then never loads, which reads as a broken feature rather than a
  # missing flag.
  #
  # This exists because Chromium takes its cookie key from the operating
  # system. Signed in on a Windows or macOS host that key is wrapped with
  # DPAPI or the login Keychain, and the container can unwrap neither, so the
  # profile arrives looking healthy and behaving as though it were logged out.
  signin:
    build: .
    image: rewards-farmer
    platform: linux/amd64
    shm_size: 1gb
    command: ["python", "src/signin.py"]
    environment:
      # One name. Signing in is one browser window, so one account at a time.
      REWARDS_ACCOUNTS: ${REWARDS_ACCOUNTS:-}
    ports:
      # 127.0.0.1 is the security boundary, not decoration: for as long as this
      # is up the port shows a live Microsoft sign-in page. When the container
      # runs on another machine, set SIGNIN_BIND to that machine's own address
      # for the run instead of publishing to the whole network:
      #
      #   SIGNIN_BIND=192.168.1.50 docker compose run --rm --service-ports signin
      #
      # Then open http://192.168.1.50:6080. 0.0.0.0 listens on every interface
      # and offers a live account session to the whole network.
      - "${SIGNIN_BIND:-127.0.0.1}:6080:6080"
    volumes:
      - ./data-dir:/app/data-dir
